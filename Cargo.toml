[package]
name = "gravitylancacheui"
version = "0.2.1"
edition = "2021"
description = "Modern LanCache monitoring dashboard with live stats, cache analysis, and prefill management"
license = "MIT"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["ws", "macros"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "compression-gzip"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
tokio-rusqlite = "0.6"

# HTTP client (Steam API, game resolution)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# File watching (log tail)
notify = "7"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Regex for log parsing
regex = "1"
once_cell = "1"

# UUID for unique identifiers
uuid = { version = "1", features = ["v4"] }

# System info (disk usage)
sysinfo = "0.32"

# Byte formatting
bytesize = "1"

# Environment variables
dotenvy = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

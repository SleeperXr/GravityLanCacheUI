<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GravityLancacheUI — Modern LanCache Monitoring Dashboard">
  <title>GravityLancacheUI</title>
  <link rel="stylesheet" href="/css/index.css">
  <style>
    /* Inline critical: prevent FOUC */
    body { background: #0a0e17; color: #f1f5f9; }
  </style>
</head>
<body>
  <div class="app" id="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <a href="#/" class="logo">
        <div class="logo-icon">🚀</div>
        <div class="logo-text">Gravity<span>Cache</span> <span style="font-size: 0.6rem; font-weight: 700; color: var(--text-muted); background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; font-family: var(--font-mono); vertical-align: middle; margin-left: 4px;">v0.1</span></div>
      </a>

      <nav>
        <div class="nav-section">
          <div class="nav-section-title">Monitoring</div>
          <button class="nav-item active" data-page="dashboard" id="nav-dashboard">
            <span class="icon">📊</span> Dashboard
          </button>
          <button class="nav-item" data-page="downloads" id="nav-downloads">
            <span class="icon">📥</span> Downloads
          </button>
          <button class="nav-item" data-page="cache" id="nav-cache">
            <span class="icon">💾</span> Cache
          </button>
          <button class="nav-item" data-page="clients" id="nav-clients">
            <span class="icon">🖥️</span> Clients
          </button>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">Tools</div>
          <button class="nav-item" data-page="prefill" id="nav-prefill">
            <span class="icon">⚡</span> Prefill
          </button>
          <button class="nav-item" data-page="logs" id="nav-logs">
            <span class="icon">📜</span> Logs
          </button>
        </div>

        <div class="nav-section" style="margin-top:auto">
          <button class="nav-item" data-page="settings" id="nav-settings">
            <span class="icon">⚙️</span> Settings
          </button>
          <div style="font-size:0.6rem;color:var(--text-muted);opacity:0.5;text-align:center;padding:12px 16px 0;font-family:var(--font-mono)">v0.1.0</div>
        </div>
      </nav>
    </aside>

    <!-- Top Bar -->
    <header class="topbar" id="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <h1 style="font-size:1.1rem;font-weight:600" id="page-title">Dashboard</h1>
      </div>

      <!-- Scanning Progress Banner (dynamisch gesteuert) -->
      <div id="parser-progress-container" style="display:none;align-items:center;gap:12px;background:rgba(99, 102, 241, 0.1);border:1px solid rgba(99, 102, 241, 0.2);padding:6px 16px;border-radius:20px;font-size:0.8rem;width:380px;box-shadow:0 0 15px rgba(99, 102, 241, 0.05)">
        <span id="parser-progress-label" style="white-space:nowrap;font-weight:700;color:var(--accent-primary-light)">⚡ SCANNING LOGS...</span>
        <div id="parser-progress-bar-wrapper" style="flex:1;height:6px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden;position:relative">
          <div id="parser-progress-bar" style="height:100%;background:linear-gradient(90deg, var(--accent-primary), var(--accent-primary-light));width:0%;transition:width 0.3s ease"></div>
        </div>
        <span id="parser-progress-text" style="font-family:var(--font-mono);font-size:0.75rem;color:var(--text-secondary);white-space:nowrap;font-weight:600">0.0%</span>
      </div>

      <div style="display:flex;align-items:center;gap:16px">
        <span id="ws-status" style="display:flex;align-items:center;gap:6px;font-size:0.8rem;color:var(--text-muted)">
          <span class="live-dot"></span> Live
        </span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <!-- Pages rendered here by JS -->
    </main>
  </div>

  <!-- Setup Wizard (shown on first run if checks fail) -->
  <div class="wizard-overlay" id="setup-wizard" style="display:none">
    <div class="wizard-card">
      <h2 class="wizard-title">🔧 Setup Wizard</h2>
      <p style="color:var(--text-secondary);margin-bottom:24px">
        Checking your LanCache configuration...
      </p>
      <div id="wizard-checks"></div>
      <div style="margin-top:24px;display:flex;gap:12px;justify-content:flex-end">
        <button class="btn btn-ghost" id="wizard-skip">Skip</button>
        <button class="btn btn-primary" id="wizard-recheck">Re-check</button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>

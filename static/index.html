<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GravityLancacheUI — Modern LanCache Monitoring Dashboard">
  <meta property="og:title" content="GravityLancacheUI">
  <meta property="og:description" content="GravityLancacheUI — Modern LanCache Monitoring Dashboard">
  <meta property="og:type" content="website">
  <title>GravityLancacheUI</title>
  <link rel="stylesheet" href="/css/index.css">
  <style>
    /* Inline critical: prevent FOUC */
    body { background: #0a0e17; color: #f1f5f9; }
  </style>
</head>
<body>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <div class="app" id="app">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <a href="#/" class="logo">
        <div class="logo-icon">🚀</div>
        <div class="logo-text">Gravity<span>Cache</span> <span class="logo-version">v0.2</span></div>
      </a>

      <nav>
        <div class="nav-section">
          <div class="nav-section-title">Monitoring</div>
          <button class="nav-item active" data-page="dashboard" id="nav-dashboard">
            <span class="icon">📊</span> Dashboard
          </button>
          <button class="nav-item" data-page="downloads" id="nav-downloads">
            <span class="icon">📥</span> Downloads
          </button>
          <button class="nav-item" data-page="cache" id="nav-cache">
            <span class="icon">💾</span> Cache
          </button>
          <button class="nav-item" data-page="clients" id="nav-clients">
            <span class="icon">🖥️</span> Clients
          </button>
        </div>

        <div class="nav-section">
          <div class="nav-section-title">Tools</div>
          <button class="nav-item" data-page="prefill" id="nav-prefill">
            <span class="icon">⚡</span> Prefill
          </button>
          <button class="nav-item" data-page="logs" id="nav-logs">
            <span class="icon">📜</span> Logs
          </button>
        </div>

        <div class="nav-section nav-section-bottom">
          <button class="nav-item" data-page="settings" id="nav-settings">
            <span class="icon">⚙️</span> Settings
          </button>
          <div class="sidebar-version">v0.2.0</div>
        </div>
      </nav>
    </aside>

    <!-- Top Bar -->
    <header class="topbar" id="topbar">
      <div class="topbar-left">
        <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle Menu">☰</button>
        <h1 id="page-title">Dashboard</h1>
      </div>

      <!-- Scanning Progress Banner (dynamisch gesteuert) -->
      <div id="parser-progress-container" class="parser-progress-container">
        <span id="parser-progress-label" class="parser-progress-label">⚡ SCANNING...</span>
        <div id="parser-progress-bar-wrapper" class="parser-progress-bar-wrapper">
          <div id="parser-progress-bar" class="parser-progress-bar"></div>
        </div>
        <span id="parser-progress-text" class="parser-progress-text">0.0%</span>
      </div>

      <div class="topbar-right">
        <span id="ws-status">
          <span class="live-dot"></span> Live
        </span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
      <!-- Pages rendered here by JS -->
    </main>
  </div>

  <!-- Setup Wizard (shown on first run if checks fail) -->
  <div class="wizard-overlay" id="setup-wizard">
    <div class="wizard-card">
      <h2 class="wizard-title">🔧 Setup Wizard</h2>
      <p>
        Checking your LanCache configuration...
      </p>
      <div id="wizard-checks"></div>
      <div class="wizard-actions">
        <button class="btn btn-ghost" id="wizard-skip">Skip</button>
        <button class="btn btn-primary" id="wizard-recheck">Re-check</button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
